[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paysawa"
dynamic = ["version"]
description = "Python SDK for Paysawa, the mobile money gateway (MTN / Orange): collect, withdraw, payment links and signed webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Paysawa"}]
keywords = ["paysawa", "mobile money", "payments", "cameroon", "mtn", "orange money", "xaf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25", "PyJWT>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USER/paysawa-python"
Issues = "https://github.com/YOUR-GITHUB-USER/paysawa-python/issues"
Changelog = "https://github.com/YOUR-GITHUB-USER/paysawa-python/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "paysawa._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paysawa = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
